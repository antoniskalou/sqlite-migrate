version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - modernize
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
