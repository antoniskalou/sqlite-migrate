version: 2
project_name: smidge
before:
  hooks:
    - go mod tidy

builds:
  - id: smidge
    main: ./cmd/smidge
    binary: smidge
    ldflags:
      # strip debug info, make binaries smaller
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: checksums.txt

changelog:
  use: github
