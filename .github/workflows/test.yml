name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download
       
      - name: Check formatting
        shell: bash
        run: |
          test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        shell: bash
        run: go test -race -count=20 -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

      - name: Publish coverage
        # don't need to publish for all, output is the same
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          path: coverage.out
          archive: false
