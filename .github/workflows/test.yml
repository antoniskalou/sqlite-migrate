name: Tests

on:
  pull_request:
  push:
    branches: [main]

# for golangci
permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint and vulncheck on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          # don't specify version, force action to use preinstalled version.
          # govulncheck-action is broken and doesn't work with go-version-file
          # properly.
          go-version-input:
          go-package: ./...
          cache: false # already done with setup-go
  
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        shell: bash
        run: go test -race -count=20 -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

      - name: Generate coverage HTML
        # don't need to publish for all, output is the same
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Publish coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html

